<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>График 2/2</title>
<link rel="manifest" href="/Grafic22/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="https://via.placeholder.com/192x192/2ecc71/ffffff?text=2/2">
<style>
  body {
    margin: 0;
    font-family: Roboto, sans-serif;
    background: #1a1a2e;
    color: #fff;
    padding: 16px;
  }
  h1 { font-size: 20px; text-align: center; margin: 0 0 16px; }
  .today {
    text-align: center;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 16px;
    font-size: 18px;
    font-weight: bold;
  }
  .work { background: #2ecc71; }
  .off  { background: #ff5252; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .header button {
    background: #16213e;
    color: #fff;
    border: none;
    font-size: 22px;
    width: 44px;
    height: 44px;
    border-radius: 12px;
  }
  .header .month { font-size: 17px; font-weight: bold; }
  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekdays div {
    text-align: center;
    font-size: 12px;
    color: #888;
    padding: 4px 0;
  }
  .days div {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 15px;
    background: #16213e;
  }
  .days .work { background: #2ecc71; }
  .days .off  { background: #ff5252; }
  .days .empty { background: transparent; }
  .days .today-mark {
    border: 2px solid #fff;
  }
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
    font-size: 13px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .settings {
    margin-top: 20px;
    background: #16213e;
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
  }
  .settings label { display: block; margin-bottom: 8px; color: #aaa; }
  .settings input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #0f1626;
    color: #fff;
    font-size: 15px;
  }
  .settings small { color: #666; display: block; margin-top: 6px; }
</style>
</head>
<body>

<h1>📅 График 2/2</h1>

<div id="today" class="today">—</div>

<div class="header">
  <button onclick="changeMonth(-1)">‹</button>
  <div class="month" id="monthLabel"></div>
  <button onclick="changeMonth(1)">›</button>
</div>

<div class="weekdays">
  <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
</div>

<div class="days" id="days"></div>

<div class="legend">
  <span><i class="dot" style="background:#2ecc71"></i>Работа</span>
  <span><i class="dot" style="background:#ff5252"></i>Выходной</span>
</div>

<div class="settings">
  <label>Дата первого рабочего дня</label>
  <input type="date" id="startDate">
  <small>От этой даты считается цикл: 2 рабочих → 2 выходных</small>
</div>

<script>
  var STORAGE_KEY = 'work_start_date';

  var startDate = localStorage.getItem(STORAGE_KEY);
  if (!startDate) {
    var d = new Date();
    startDate = d.toISOString().slice(0,10);
    localStorage.setItem(STORAGE_KEY, startDate);
  }

  var input = document.getElementById('startDate');
  input.value = startDate;
  input.addEventListener('change', function() {
    startDate = input.value;
    localStorage.setItem(STORAGE_KEY, startDate);
    render();
  });

  var months = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  var viewDate = new Date();

  function isWorkDay(date) {
    var start = new Date(startDate + 'T00:00:00');
    var cur = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var diff = Math.floor((cur - start) / 86400000);
    var mod = ((diff % 4) + 4) % 4;
    return mod === 0 || mod === 1;
  }

  function changeMonth(delta) {
    viewDate.setMonth(viewDate.getMonth() + delta);
    render();
  }

  function render() {
    var y = viewDate.getFullYear();
    var m = viewDate.getMonth();
    document.getElementById('monthLabel').textContent = months[m] + ' ' + y;

    var firstDay = new Date(y, m, 1);
    var startWeekday = firstDay.getDay();
    startWeekday = (startWeekday + 6) % 7;

    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var container = document.getElementById('days');
    container.innerHTML = '';

    var i;
    for (i = 0; i < startWeekday; i++) {
      var e = document.createElement('div');
      e.className = 'empty';
      container.appendChild(e);
    }

    var today = new Date();
    var isCurrentMonth = today.getFullYear() === y && today.getMonth() === m;

    for (var d = 1; d <= daysInMonth; d++) {
      var date = new Date(y, m, d);
      var el = document.createElement('div');
      el.textContent = d;
      el.className = isWorkDay(date) ? 'work' : 'off';
      if (isCurrentMonth && today.getDate() === d) el.classList.add('today-mark');
      container.appendChild(el);
    }

    var todayBox = document.getElementById('today');
    var work = isWorkDay(today);
    todayBox.className = 'today ' + (work ? 'work' : 'off');
    todayBox.textContent = work ? '🟢 Сегодня — рабочий день' : '🔴 Сегодня — выходной';
  }

  render();
</script>
</body>
</html>
